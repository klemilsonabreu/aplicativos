                        <body>
                            <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roda da Vida</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="range"] {
            cursor: pointer;
            height: 6px;
        }

        .value-display {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 30px;
        }

        .areas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .area-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .area-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .area-score {
            font-size: 1.8em;
            color: #667eea;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Roda da Vida</h1>
        
        <form class="form-grid" id="rodaForm">
            <div class="form-group">
                <label for="saude">Saúde</label>
                <input type="range" id="saude" min="0" max="10" value="5">
                <div class="value-display" id="saudeValue">5</div>
            </div>

            <div class="form-group">
                <label for="carreira">Carreira</label>
                <input type="range" id="carreira" min="0" max="10" value="5">
                <div class="value-display" id="carreiraValue">5</div>
            </div>

            <div class="form-group">
                <label for="financas">Finanças</label>
                <input type="range" id="financas" min="0" max="10" value="5">
                <div class="value-display" id="financasValue">5</div>
            </div>

            <div class="form-group">
                <label for="familia">Família</label>
                <input type="range" id="familia" min="0" max="10" value="5">
                <div class="value-display" id="familiaValue">5</div>
            </div>

            <div class="form-group">
                <label for="amizades">Amizades</label>
                <input type="range" id="amizades" min="0" max="10" value="5">
                <div class="value-display" id="amizadesValue">5</div>
            </div>

            <div class="form-group">
                <label for="romance">Romance</label>
                <input type="range" id="romance" min="0" max="10" value="5">
                <div class="value-display" id="romanceValue">5</div>
            </div>

            <div class="form-group">
                <label for="lazer">Lazer</label>
                <input type="range" id="lazer" min="0" max="10" value="5">
                <div class="value-display" id="lazerValue">5</div>
            </div>

            <div class="form-group">
                <label for="crescimento">Crescimento Pessoal</label>
                <input type="range" id="crescimento" min="0" max="10" value="5">
                <div class="value-display" id="crescimentoValue">5</div>
            </div>
        </form>

        <div class="button-group">
            <button type="button" class="btn-generate" onclick="gerarRoda()">Gerar Roda</button>
            <button type="button" class="btn-reset" onclick="resetarRoda()">Resetar</button>
        </div>

        <div class="chart-container">
            <canvas id="rodaCanvas"></canvas>
        </div>

        <div class="areas" id="areasContainer"></div>
    </div>

    <script>
        let chart = null;
        const areas = [
            'Saúde',
            'Carreira',
            'Finanças',
            'Família',
            'Amizades',
            'Romance',
            'Lazer',
            'Crescimento Pessoal'
        ];

        const cores = [
            '#FF6384',
            '#36A2EB',
            '#FFCE56',
            '#4BC0C0',
            '#9966FF',
            '#FF9F40',
            '#FF6384',
            '#C9CBCF'
        ];

        // Atualizar valores em tempo real
        document.querySelectorAll('input[type="range"]').forEach(input => {
            input.addEventListener('input', function() {
                const valueId = this.id + 'Value';
                document.getElementById(valueId).textContent = this.value;
            });
        });

        function obterValores() {
            return areas.map(area => {
                const id = area.toLowerCase()
                    .replace('ç', 'c')
                    .replace('á', 'a')
                    .replace(' ', '');
                
                const elementos = document.querySelectorAll(`#${id}`);
                if (elementos.length > 0) {
                    return parseInt(elementos[0].value);
                }
                return 0;
            });
        }

        function gerarRoda() {
            const valores = obterValores();
            const ctx = document.getElementById('rodaCanvas').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: areas,
                    datasets: [{
                        label: 'Minha Roda da Vida',
                        data: valores,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 10,
                            ticks: {
                                stepSize: 2,
                                font: {
                                    size: 12
                                }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: {
                                    size: 14,
                                    weight: 'bold'
                                },
                                padding: 20
                            }
                        }
                    }
                }
            });

            atualizarCards(valores);
        }

        function atualizarCards(valores) {
            const container = document.getElementById('areasContainer');
            container.innerHTML = '';

            areas.forEach((area, index) => {
                const card = document.createElement('div');
                card.className = 'area-card';
                card.style.borderLeftColor = cores[index];
                card.innerHTML = `
                    <div class="area-name">${area}</div>
                    <div class="area-score">${valores[index]}/10</div>
                `;
                container.appendChild(card);
            });
        }

        function resetarRoda() {
            document.querySelectorAll('input[type="range"]').forEach(input => {
                input.value = 5;
                const valueId = input.id + 'Value';
                document.getElementById(valueId).textContent = '5';
            });

            if (chart) {
                chart.destroy();
                chart = null;
            }

            document.getElementById('areasContainer').innerHTML = '';
        }

        // Gerar gráfico automaticamente ao carregar
        window.addEventListener('load', gerarRoda);
    </script>
</body>
</html>
